<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <header>
        <h1>EMOJIMASTER5000</h1>
        <div>
            <p id="success-count">✔: 0</p>
            <p id="failure-count">✘: 0</p>
        </div>
        <div id="game-settings">
            <p id="number-pairs"></p>
            <input type="range" name="range" id="range" min="4" max="30" value="12" step="1">

        </div>

        <button id="start-btn">Start</button>
    </header>
    <main>
        <div id="game-board">
        </div>

    </main>
    <dialog id="win-dialog">
        <div id="confetti-container"></div>
        <h2>YOU WIN! 🎉</h2>
        <p id="win-stats"></p>
        <button id="close-win-dialog">Close</button>
    </dialog>
    <footer>
        Elias production
    </footer>
    <script src="script.js" defer></script>
</body>

</html>
